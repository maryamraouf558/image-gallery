<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography Portfilio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-container">

        <!-- Navbar -->
         <header class="gallery-header">
            <div class="logo">Maryam <span>Photographie</span></div>
            <nav class="nav-meun">
                <a href="#">Portfilio</a>
                <a href="#">Commercial</a>
                <a href="#">About</a>
                <a href="#">Blog</a>
                <a href="#">contact</a>
            </nav>
         </header>

         <!-- photo grid -->
         <main class="photo-grid">

            <!-- column 1 -->
             <div class="grid-item item-tall">
                <img src="images/image-1.jpeg" alt="Mountain View">
             </div>

              <div class="grid-item item-tall">
                <img src="images/image-2.jpg" alt="Dog in Snow">
              </div>

              <div class="grid-item item-short">
                <img src="images/image-3.jpg" alt="Landscape Road">
              </div>

              <!-- column 2 -->
               <div class="grid-item item-short">
                <img src="images/image-4.jpg" alt="Snowy Peaks">
               </div>

               <div class="grid-item item-tall">
                <img src="images/image-5.jpg" alt="Girl Lake View">
               </div>

               <div class="grid-item item-tall">
                <img src="images/image-6.jpg" alt="Castle View">
               </div>

               <!-- column 3 -->

               <div class="grid-item item-medium">
                <img src="images/image-7.jpg" alt="Forest Lake">
               </div>

               <div class="grid-item item-tall">
                <img src="images/image-8.jpg" alt="Valley River">
               </div>

               <div class="grid-item item-short">
                <img src="images/image-9.jpg" alt="Mountain Peak">
               </div>

               <!-- column 4 -->
                <div class="grid-item item-short">
                    <img src="images/image-10.jpg" alt="Lake Trees">
                </div>

                <div class="grid-item item-tall">
                    <img src="images/image-11.jpg" alt="Wood Cabin">
                </div>

                <div class="grid-item item-tall">
                    <img src="images/image-12.jpg" alt="Aerial Stream">
                </div>

                <!-- Column 5 -->
                 <div class="grid-item item-medium">
                    <img src="images/image-13.jpg" alt="Sitting Girl View">
                 </div>

                 <div class="grid-item item-tall">
                    <img src="images/image-14.jpeg" alt="Aerial Road">
                 </div>

                 <div class="grid-item item-short">
                    <img src="images/image-15.jpg" alt="Mountain Fog">
                 </div>

         </main>
    </div>
</body>
</html>
